<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lab Carteles - UCR</title>
  <link rel="stylesheet" href="global.css" />
</head>
<body>

  <main class="carteles-grid">

    <!-- CARTEL 1: Amarillo - La Sede Te Acompaña -->
    <article class="cartel cartel-amarillo">
      <div class="cartel-inner">

        <!-- Header con título -->
        <header class="ca-header">
          <div class="ca-titulo-wrap">
            <span class="ca-excl ca-excl--left">¡</span>
            <div class="ca-titulo">
              <span class="ca-linea1">LA SEDE</span>
              <span class="ca-linea2">TE ACOMPAÑA</span>
            </div>

            <span class="ca-excl ca-excl--right">!</span>
          </div>
        </header>

        <!-- Cuerpo: texto + QR -->
        <section class="ca-body">
          <p class="ca-slogan">El respeto no se negocia</p>
          <p class="ca-subslogan">¡Pará ya de acosar!</p>
          <div class="ca-qr-wrap">
            <p class="ca-qr-text">Si necesitás ayuda, escaneá este QR</p>
            <img src="Multimedios.png" alt="Código QR" class="ca-qr" />
          </div>
        </section>

        <!-- Imagen personas (GokuYVegetaUCR.png) -->
        <div class="ca-imagen-wrap">
          <img
            src="GokuYVegetaUCR.png"
            alt="Estudiantes UCR haciendo señal de pare"
            class="ca-imagen"
          />
        </div>

        <!-- Footer logos -->
        <footer class="ca-footer">
          <div class="ca-logos">
            <img src="firma-ucr-ico-removebg-preview.png" alt="UCR Logo" class="ca-logo-img" />
            <div class="ca-divider"></div>
            <div class="ca-logo-acoso">
              <span class="ca-logo-ucr-small">UCR</span>
              <span class="ca-logo-acoso-text">LIBRE DE<br/>ACOSO<br/>SEXUAL</span>
            </div>
            <div class="ca-divider"></div>
            <div class="ca-logo-sede">
              <span class="ca-logo-sg">SG</span>
              <span class="ca-logo-sede-text">Sede de<br/>Guanacaste</span>
            </div>
          </div>
        </footer>

      </div>
    </article>

    <!-- CARTEL 2: Azul - Señalización UCR -->
    <article class="cartel cartel-azul">
      <div class="cartel-inner cb-inner">

        <!-- Filas de destinos -->
        <ul class="cb-lista">
          <li class="cb-item">
            <span class="cb-texto">Aulas 5, 6, 7</span>
            <span class="cb-flecha">→</span>
          </li>
          <li class="cb-item">
            <span class="cb-texto">Apoyo Informático</span>
            <span class="cb-flecha">→</span>
          </li>
          <li class="cb-item">
            <span class="cb-texto">Servidores</span>
            <span class="cb-flecha">→</span>
          </li>
          <li class="cb-item">
            <span class="cb-texto">Laboratorio 1 y 2</span>
            <span class="cb-flecha">→</span>
          </li>
          <li class="cb-item">
            <span class="cb-texto">Coordinación<br/>Informática Empresarial</span>
            <span class="cb-flecha">→</span>
          </li>
        </ul>

        <!-- Footer UCR -->
        <footer class="cb-footer">
          <img src="firma-ucr-ico-removebg-preview.png" alt="UCR Logo" class="cb-logo-img" />
        </footer>

      </div>
    </article>

  </main>

</body>
</html>
